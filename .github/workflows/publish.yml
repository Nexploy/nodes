name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: nodes
    steps:
      - uses: actions/checkout@v6
        with:
          path: nodes

      # scripts/vendor.mjs copies the slices of nexploy's private packages the
      # library uses, so the build needs a checkout beside this one.
      - uses: actions/checkout@v6
        with:
          repository: Nexploy/nexploy
          path: nexploy

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: nodes/pnpm-lock.yaml

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: npm publish --provenance
